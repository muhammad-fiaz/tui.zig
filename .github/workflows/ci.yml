name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    name: Test on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    
    steps:
    - uses: actions/checkout@v5
    
    - name: Setup Zig
      uses: mlugg/setup-zig@v2
      with:
        version: 0.16.0
    
    - name: Run tests
      run: zig build test
    
    - name: Build library
      run: zig build

  lint:
    name: Format check
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v5
    
    - name: Setup Zig
      uses: mlugg/setup-zig@v2
      with:
        version: 0.16.0
    
    - name: Check formatting
      run: zig fmt --check src/
