name: Bug Report
description: Create a report to help us improve tui.zig
title: "[Bug]: "
labels: ["bug", "triage"]
body:
  - type: markdown
    attributes:
      value: |
        Thank you for reporting an issue.

        Please confirm this is reproducible on the latest `main` branch and with Zig `0.17.0+`.
        Relevant docs: https://muhammad-fiaz.github.io/tui.zig/

  - type: textarea
    id: description
    attributes:
      label: Bug Description
      description: A clear and concise description of what the bug is.
      placeholder: "Rendering glitches, terminal restoration failure, event key mismatch..."
    validations:
      required: true

  - type: textarea
    id: reproduction
    attributes:
      label: Reproduction Steps
      description: Steps to reproduce the behavior.
      placeholder: |
        1. Initialize App with tui.init(...)
        2. Enter raw/alternate screen or headless memory backend
        3. Trigger render / input event and observe...
    validations:
      required: true

  - type: textarea
    id: expected-behavior
    attributes:
      label: Expected Behavior
      description: What should have happened instead?
      placeholder: "Cursor, layout, or widget output should render without corruption..."
    validations:
      required: true

  - type: input
    id: zig-version
    attributes:
      label: Zig Version
      description: What version of Zig are you using? (`zig version`, minimum 0.17.0+)
      placeholder: 0.17.0
    validations:
      required: true

  - type: input
    id: tui-version
    attributes:
      label: tui.zig Version
      description: What version of tui.zig are you using? (e.g. 0.1.0, main branch commit)
      placeholder: 0.1.0
    validations:
      required: true

  - type: input
    id: target
    attributes:
      label: Build Target
      description: Target triple used in build/test (supports 32-bit & 64-bit targets across Windows, Linux, macOS, ARM, RISC-V, etc.).
      placeholder: x86_64-linux-gnu
    validations:
      required: false

  - type: dropdown
    id: os
    attributes:
      label: Operating System
      options:
        - Windows
        - Linux
        - macOS
        - BSD
        - Other
    validations:
      required: true

  - type: input
    id: terminal
    attributes:
      label: Terminal Emulator & Backend
      description: Terminal app and backend mode (`auto`, `windows`, `posix`, `ansi`, `memory`).
      placeholder: "Windows Terminal / Kitty / WezTerm / Alacritty"
    validations:
      required: false

  - type: textarea
    id: minimal-code
    attributes:
      label: Minimal Reproduction Code
      description: Paste the smallest Zig code sample that reproduces the issue.
      render: zig
    validations:
      required: false

  - type: textarea
    id: logs
    attributes:
      label: Logs or Screenshots
      description: Paste any relevant logs or attach screenshots.
      render: shell

  - type: checkboxes
    id: checklist
    attributes:
      label: Checklist
      options:
        - label: I tested with Zig 0.17.0 or newer.
          required: true
        - label: I searched existing issues before creating this report.
          required: true
