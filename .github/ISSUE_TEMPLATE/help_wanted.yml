name: Help Wanted
description: Ask a question or request implementation guidance
title: "[Help]: "
labels: ["question", "triage"]
body:
  - type: markdown
    attributes:
      value: |
        Need help? Please check docs first: https://muhammad-fiaz.github.io/tui.zig/

  - type: textarea
    id: question
    attributes:
      label: Question
      description: What do you need help with?
      placeholder: "How do I build a custom stateful widget or configure responsive layouts?"
    validations:
      required: true

  - type: textarea
    id: context
    attributes:
      label: Context / What You Tried
      description: Include code snippets and attempts so far.
      render: zig

  - type: input
    id: zig-version
    attributes:
      label: Zig Version
      description: What version of Zig are you using? (`zig version`, minimum 0.17.0+)
      placeholder: 0.17.0
    validations:
      required: true

  - type: input
    id: tui-version
    attributes:
      label: tui.zig Version
      description: What version of tui.zig are you using? (e.g. 0.1.0, main branch commit)
      placeholder: 0.1.0
    validations:
      required: true

  - type: dropdown
    id: os
    attributes:
      label: Operating System
      options:
        - Windows
        - Linux
        - macOS
        - BSD
        - Other
    validations:
      required: true
