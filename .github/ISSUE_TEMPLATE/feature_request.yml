name: Feature Request
description: Suggest a new feature or enhancement for TUI.zig
title: "[Feature]: "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for suggesting a feature! Please describe what you'd like to see added.

  - type: textarea
    id: problem
    attributes:
      label: Problem Statement
      description: Is this related to a problem? Describe what you're trying to do.
      placeholder: "I'm always frustrated when..."
    validations:
      required: false

  - type: textarea
    id: solution
    attributes:
      label: Proposed Solution
      description: Describe the solution you'd like.
      placeholder: Describe the feature you want...
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives Considered
      description: Describe any alternative solutions or features you've considered.
      placeholder: Other approaches you've thought about...
    validations:
      required: false

  - type: dropdown
    id: widget_type
    attributes:
      label: Related Widget
      description: Is this related to a specific widget?
      options:
        - General / Core
        - Text
        - Button
        - InputField
        - TextArea
        - Checkbox
        - Radio
        - Switch
        - Slider
        - ProgressBar
        - Spinner
        - ListView
        - Table
        - Tabs
        - Modal
        - Accordion
        - Alert
        - Badge
        - Breadcrumb
        - Card
        - Grid
        - Image
        - Menu
        - Navbar
        - Pagination
        - ScrollView
        - Separator
        - Sidebar
        - Skeleton
        - SplitView
        - Statusbar
        - Toast
        - Tooltip
        - Tree
        - Other
    validations:
      required: false

  - type: textarea
    id: additional
    attributes:
      label: Additional Context
      description: Add any other context, mockups, or examples about the feature request.
      placeholder: Any additional information...
    validations:
      required: false
